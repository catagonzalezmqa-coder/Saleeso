const clHtml=c=>{const l=[...S.chats];if(c.pv)l.unshift(c);return `<aside class="cl"><h2>Chats</h2>${l.map(x=>{const q=EV(x.ev),lm=x.msgs[x.msgs.length-1];return `<button class="ci ${x.id==c.id?"on":""}" onclick="S.chat='${x.id}';go('chat')"><span class="av" style="width:46px;height:46px;flex-shrink:0;background:${bg(q)}"></span><span style="flex:1;min-width:0"><b>${esc(x.name)}</b>${x.pv?' <span class="tag">solo lectura</span>':""}<span class="mut" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${esc(lm[0])}: ${esc(lm[1])}</span></span></button>`}).join("")}</aside>`};
function newPlan(){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="sheet" role="dialog" aria-label="Crear plan"><h2>Nuevo plan</h2><label class="field"><input id="np1" placeholder="¿Qué plan armás?" aria-label="Nombre"></label><label class="field"><input id="np2" placeholder="¿Dónde? (lugar o barrio)" aria-label="Lugar"></label><label class="field"><input id="np3" type="time" value="20:00" aria-label="Hora"><select id="np4" aria-label="Categoría">${INT.slice(0,8).map(x=>`<option>${x[0]}</option>`).join("")}</select></label><button class="btn pri" id="npb">Publicar plan</button><button class="omit" id="npc">Cancelar</button></div>`;$.appendChild(o);document.getElementById("npc").onclick=()=>o.remove();document.getElementById("npb").onclick=()=>{const t=np1.value.trim(),p=np2.value.trim();if(!t||!p){toast("Poné un nombre y un lugar");return}const c=np4.value,bb=BR.find(q=>nz(q[0])==nz(p))||BR.find(q=>nz(p).includes(nz(q[0]))),e={id:Date.now(),t,pl:p,b:p,c,d:"Hoy",h:np3.value,n:1,tg:[c],cv:"linear-gradient(135deg,#7A00FF,#00E5FF)",x:50,y:50,la:(bb?bb[1]:S.pos.la)+(Math.random()-.5)*.004,ln:(bb?bb[2]:S.pos.ln)+(Math.random()-.5)*.004,col:"#7A00FF",ds:"Plan creado por vos. Sumá gente y armá el grupo.",how:"Coordiná el punto de encuentro en el chat."};S.custom.push(e);S.going.push(e.id);S.f="Todos";sv();o.remove();S.ev=e.id;go("detail");toast("¡Plan publicado!")}}
draw();
